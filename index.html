<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Leaderboard</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }
    .box {
      width: 400px;
      background: #1a1a1a;
      padding: 20px;
      border-radius: 10px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      border-bottom: 1px solid #333;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>🏆 Leaderboard</h2>
    <div id="list">Loading...</div>
  </div>

<script>
async function load() {
  try {
    const api =
      "https://api.roulobets.com/v1/external/affiliates?start_at=2025-11-19&end_at=2025-11-21&key=8y0afvsy0tjhr01ff7q5k1jadtc72sgx";

    const proxy = "https://api.allorigins.win/raw?url=";

    const res = await fetch(proxy + encodeURIComponent(api));
    const data = await res.json();

    console.log("API RESPONSE:", data);

    // ✅ AUTO DETECT DATA FORMAT (THIS FIXES YOUR ISSUE)
    let list = [];

    if (Array.isArray(data)) {
      list = data;
    } else if (Array.isArray(data.data)) {
      list = data.data;
    } else if (Array.isArray(data.result)) {
      list = data.result;
    } else if (Array.isArray(data.leaderboard)) {
      list = data.leaderboard;
    }

    list.sort((a, b) => (b.wagered || 0) - (a.wagered || 0));

    let html = "";

    list.slice(0, 10).forEach((u, i) => {
      const medal =
        i === 0 ? "🥇" :
        i === 1 ? "🥈" :
        i === 2 ? "🥉" : `#${i + 1}`;

      html += `
        <div class="row">
          <div>${medal} ${u.username || "Unknown"}</div>
          <div>$${Number(u.wagered || 0).toLocaleString()}</div>
        </div>
      `;
    });

    document.getElementById("list").innerHTML =
      html || "No leaderboard data available";

  } catch (e) {
    console.log(e);
    document.getElementById("list").innerHTML =
      "Error loading data (API failed)";
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
