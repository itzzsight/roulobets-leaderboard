<script>
const API_URL = "https://api.roulobets.com/v1/external/affiliates?start_at=2025-11-19&end_at=2025-11-21&key=8y0afvsy0tjhr01ff7q5k1jadtc72sgx";

// Public CORS proxy (no backend needed)
const PROXY = "https://api.allorigins.win/raw?url=";

async function load() {
  try {
    const res = await fetch(PROXY + encodeURIComponent(API_URL));
    const data = await res.json();

    const list = data.data || [];

    list.sort((a, b) => (b.wagered || 0) - (a.wagered || 0));

    let html = "";

    list.slice(0, 10).forEach((u, i) => {
      const medal =
        i === 0 ? "🥇" :
        i === 1 ? "🥈" :
        i === 2 ? "🥉" : `#${i + 1}`;

      html += `
        <div class="row">
          <div>${medal} ${u.username || "Unknown"}</div>
          <div>$${Number(u.wagered || 0).toLocaleString()}</div>
        </div>
      `;
    });

    document.getElementById("list").innerHTML = html;

  } catch (e) {
    console.log(e);
    document.getElementById("list").innerHTML =
      "⚠️ Error loading data (API or proxy blocked)";
  }
}

load();
setInterval(load, 60000);
</script>
